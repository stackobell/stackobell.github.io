<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Stack Digital</title>
    <style>
        :root {
            --bg: #f4f4f2;
            --text: #0a0a0a;
            --accent: #f2a900;
            --muted: #555555;
            --border: #cccccc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Bar */
        header {
            width: 100%;
            border-bottom: 1px solid var(--text);
            padding: 20px 4%;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 20px;
            position: relative;
            background-color: var(--bg);
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.03em;
            text-decoration: none;
            color: var(--text);
        }

        .logo span {
            color: var(--muted);
            font-weight: 300;
        }

        .nav-center {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .nav-center a, .nav-right a, .mobile-menu a {
            color: var(--text);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            padding-bottom: 4px;
            transition: color 0.2s;
        }

        .nav-center a::after, .mobile-menu a::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: var(--accent);
            transform-origin: bottom left;
            transition: transform 0.25s ease-out;
        }

        .nav-center a:hover, .mobile-menu a:hover {
            color: var(--accent);
        }

        .nav-center a:hover::after, .mobile-menu a:hover::after {
            transform: scaleX(1);
        }

        .nav-right {
            display: flex;
            justify-content: flex-end;
        }

        /* Mobile Hamburger */
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 26px;
            height: 18px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 101;
        }

        .hamburger span {
            width: 100%;
            height: 2px;
            background-color: var(--text);
            transition: all 0.3s ease-in-out;
        }

        .hamburger.active span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        .mobile-menu {
            display: none;
            flex-direction: column;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background-color: var(--bg);
            border-bottom: 1px solid var(--text);
            padding: 30px 4%;
            gap: 20px;
            align-items: flex-start;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        .mobile-menu.open {
            display: flex;
        }

        /* Main Form Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 4%;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .page-intro {
            font-size: 1.15rem;
            color: var(--muted);
            margin-bottom: 40px;
            line-height: 1.5;
        }

        /* Form Styling */
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            background-color: transparent;
            border: 1px solid var(--text);
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            min-height: 140px;
        }

        .submit-btn {
            align-self: flex-start;
            background-color: var(--accent);
            color: var(--text);
            border: none;
            padding: 16px 36px;
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        @media (max-width: 900px) {
            header {
                display: flex;
                justify-content: space-between;
                padding: 18px 5%;
            }

            .nav-center, .nav-right {
                display: none;
            }

            .hamburger {
                display: flex;
            }

            main {
                padding: 40px 5%;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .submit-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">stack<span>digital</span></a>
        
        <nav class="nav-center">
            <a href="ecommerce.html">E-Commerce Optimisation</a>
            <a href="marketing.html">Performance Marketing</a>
            <a href="strategy.html">SME Growth Strategy</a>
        </nav>
        
        <nav class="nav-right">
            <a href="contact.html">Contact</a>
        </nav>

        <button class="hamburger" id="hamburger-btn" aria-label="Toggle Navigation Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="mobile-menu" id="mobile-menu">
            <a href="ecommerce.html">E-Commerce Optimisation</a>
            <a href="marketing.html">Performance Marketing</a>
            <a href="strategy.html">SME Growth Strategy</a>
            <a href="contact.html">Contact</a>
        </div>
    </header>

    <main>
        <h1>Let's Talk</h1>
        <p class="page-intro">Fill out the details below to arrange a free consultation.</p>

        <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="+353 87 123 4567">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label for="intro">Brief Intro</label>
                <textarea id="intro" name="intro" required placeholder="Tell me a bit about your business, current bottlenecks, or goals..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </main>

    <script>
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const mobileMenu = document.getElementById('mobile-menu');

        hamburgerBtn.addEventListener('click', () => {
            hamburgerBtn.classList.toggle('active');
            mobileMenu.classList.toggle('open');
        });
    </script>

</body>
</html>
