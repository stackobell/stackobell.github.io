<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Digital | Commercial Growth Consultant</title>
    <style>
        :root {
            --bg: #f4f4f2; /* Off-white premium editorial background */
            --text: #0a0a0a; /* Stark black */
            --accent: #f2a900; /* Vibrant orange/yellow accent */
            --muted: #555555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Bar */
        header {
            width: 100%;
            border-bottom: 1px solid var(--text);
            padding: 20px 4%;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.03em;
        }

        .logo span {
            color: var(--muted);
            font-weight: 300;
        }

        /* Centered Nav Links */
        .nav-center {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .nav-center a, .nav-right a {
            color: var(--text);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            padding-bottom: 4px;
            transition: color 0.2s;
        }

        .nav-center a::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: var(--accent);
            transform-origin: bottom left;
            transition: transform 0.25s ease-out;
        }

        .nav-center a:hover {
            color: var(--accent);
        }

        .nav-center a:hover::after {
            transform: scaleX(1);
        }

        .nav-right {
            display: flex;
            justify-content: flex-end;
        }

        /* Left-Aligned Main Layout */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            text-align: left;
            padding: 60px 4%;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* Wrapper to keep geometric circles positioned correctly relative to text */
        .hero-text-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 30px;
        }

        /* Geometric Accents */
        .circle-solid {
            position: absolute;
            width: 140px;
            height: 140px;
            background-color: var(--accent);
            border-radius: 50%;
            top: -20px;
            left: -40px;
            z-index: 1;
        }

        .circle-outline {
            position: absolute;
            width: 160px;
            height: 160px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            bottom: -30px;
            right: -20px;
            z-index: 1;
        }

        h1 {
            font-size: clamp(4rem, 9vw, 7.5rem);
            line-height: 0.85;
            font-weight: 800;
            letter-spacing: -0.04em;
            position: relative;
            z-index: 2;
        }

        /* Force lowercase on 'stack' and uppercase on 'DIGITAL' */
        .lowercase {
            text-transform: lowercase;
            display: block;
        }

        .uppercase {
            text-transform: uppercase;
            display: block;
        }

        /* Pitch & Contact Block */
        .intro-block {
            max-width: 650px;
            margin-bottom: 50px;
        }

        .intro-text {
            font-size: 1.25rem;
            line-height: 1.5;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .contact-link {
            display: inline-block;
            color: var(--text);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 2px;
            transition: color 0.2s;
        }

        .contact-link:hover {
            color: var(--accent);
        }

        /* Brands/Clients Section - Moved Up & Full Width */
        .brands-section {
            width: 100%;
            border-top: 1px solid var(--text);
            padding-top: 30px;
            margin-top: 10px;
        }

        .brands-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            font-weight: 600;
            margin-bottom: 30px;
        }

        .brands-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
            width: 100%;
        }

        .brand-logo-container {
            height: 55px; /* Increased height to make logos larger */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease-in-out;
        }

        .brand-logo-container:hover {
            transform: translateY(-2px) rotate(1deg); /* Subtle hover tilt/lift */
        }

        .brand-logo-container img {
            height: 100%;
            max-width: 170px; /* Increased max width for fuller screen usage */
            width: auto;
            object-fit: contain;
            mix-blend-mode: multiply; /* Blends white background seamlessly */
        }

        /* Responsive scaling for mobile devices */
        @media (max-width: 900px) {
            header {
                grid-template-columns: 1fr;
                gap: 15px;
                text-align: center;
            }
            .nav-center {
                flex-direction: column;
                gap: 10px;
            }
            .nav-right {
                justify-content: center;
            }
            h1 {
                font-size: 5rem;
            }
            .circle-solid {
                width: 100px;
                height: 100px;
                top: -10px;
                left: -20px;
            }
            .circle-outline {
                width: 110px;
                height: 110px;
                bottom: -15px;
                right: -10px;
            }
            .brands-grid {
                gap: 25px;
                justify-content: flex-start;
            }
            .brand-logo-container {
                height: 40px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">stack<span>digital</span></div>
        <nav class="nav-center">
            <a href="ecommerce.html">E-Commerce Optimisation</a>
            <a href="marketing.html">Performance Marketing</a>
            <a href="strategy.html">SME Growth Strategy</a>
        </nav>
        <nav class="nav-right">
            <a href="mailto:hello@stackdigital.ie">Contact</a>
        </nav>
    </header>

    <main>
        <div class="hero-text-wrapper">
            <div class="circle-solid"></div>
            <h1>
                <span class="lowercase">stack</span>
                <span class="uppercase">digital</span>
            </h1>
            <div class="circle-outline"></div>
        </div>

        <div class="intro-block">
            <p class="intro-text">
                Building high-performance digital frameworks that scale your sales. No fluff, just commercial growth for established SMEs.
            </p>
            <a href="mailto:hello@stackdigital.ie" class="contact-link">hello@stackdigital.ie</a>
        </div>

        <!-- Brands I've Helped Section - Spanning full width under intro -->
        <div class="brands-section">
            <div class="brands-title">Brands I've helped</div>
            <div class="brands-grid">
                
                <div class="brand-logo-container" title="Bewley's">
                    <img src="images/bewleys.png.png" alt="Bewley's Logo">
                </div>

                <div class="brand-logo-container" title="Windsor Motors">
                    <img src="images/windsor.png.png" alt="Windsor Motors Logo">
                </div>

                <div class="brand-logo-container" title="Nissan Ireland">
                    <img src="images/nissan.png.png" alt="Nissan Logo">
                </div>

                <div class="brand-logo-container" title="Renault Ireland">
                    <img src="images/renault.png.png" alt="Renault Logo">
                </div>

                <div class="brand-logo-container" title="McGuirks Golf">
                    <img src="images/mcguirks.png.png" alt="McGuirks Golf Logo">
                </div>

                <div class="brand-logo-container" title="Dublin City University">
                    <img src="images/DCU.png.png" alt="DCU Logo">
                </div>

            </div>
        </div>
    </main>

</body>
</html>
